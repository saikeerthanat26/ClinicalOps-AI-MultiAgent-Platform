services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: clinicalops-ai-api:phase12
    container_name: clinicalops-api

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8000/health"
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3


  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui

    image: clinicalops-ai-ui:phase12
    container_name: clinicalops-ui

    environment:
      CLINICALOPS_API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:8501/"
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
